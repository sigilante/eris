# Eris mars (serf) — its own Cargo workspace, isolated from the nockchain
# monorepo. nockvm is path-dep'd into the patched submodule, where
# patches/nockchain/0001-standalone-nockvm-ws.patch makes crates/nockvm a
# standalone workspace root. Run `patches/apply.sh nockchain` before building.
[workspace]
resolver = "2"

[package]
name = "eris-serf"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "eris-serf"
path = "src/main.rs"

[dependencies]
nockvm = { path = "../third_party/nockchain/crates/nockvm/rust/nockvm" }
# For building `HotEntry` jet-registration paths (`Either::Left`); version
# matches the nockchain workspace pin so the `HotEntry` type is identical.
either = "1.9.0"
# nockvm's own forks (same path, so Cargo unifies the crate with nockvm's dep —
# `UBig` interops with `Atom::{as_ubig,from_ubig}`). ibig: arbitrary-precision
# bit math for `+mat`/`+rub`. murmur3: the hash behind `+muk` (== nockvm's mug).
ibig = { path = "../third_party/nockchain/crates/nockvm/rust/ibig" }
murmur3 = { path = "../third_party/nockchain/crates/nockvm/rust/murmur3" }
# Pure-Rust IEEE-754 SoftFloat for the `@r` float-door jets (`+rs`/`+rd`/`+rh`/
# `+rq`); rev-pinned to match the numerics `hoon-float-jets` reference.
sdfloat = { git = "https://github.com/sigilante/RustFloat.git", rev = "f7d449c" }
